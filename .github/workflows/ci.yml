# Checks every pull request and every push to main. A pull request can merge
# only when these pass (set as required checks on the main branch).
name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Prototype links and scripts are intact
        run: |
          status=0
          for page in *.html app/*.html; do
            dir=$(dirname "$page")
            for ref in $(grep -oE '(href|src)="[^"#?]+' "$page" | sed -E 's/^(href|src)="//' | grep -vE '^(https?:|mailto:|tel:|data:|//)'); do
              if [ ! -e "$dir/$ref" ]; then echo "::error file=$page::missing $ref"; status=1; fi
            done
          done
          for js in app/*.js; do node --check "$js" || status=1; done
          exit $status
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Schema and migrations match
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations || {
            echo "::error::packages/db/src/schema.ts changed without a migration. Run 'pnpm db:generate' and commit the result."
            exit 1
          }
      - name: No known critical vulnerabilities
        run: pnpm audit --prod --audit-level critical

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sevak:ci .

  migrations:
    name: Migrations on PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same PostgreSQL version as Cloud SQL. Applies every migration to an
    # empty database, then the demo data, then migrations again (a no-op).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres # throwaway CI database
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
        env:
          SEVAK_ENV: staging
      - run: pnpm db:migrate

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Real browsers: the prototype's pages (tests/run.sh), then whole flows
    # with several people against the built app and PostgreSQL 18
    # (tests/e2e/run.sh): sign-in, organizations, joining, events, sign-ups.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres # throwaway CI database
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright and Chromium
        run: |
          npm install --global playwright@1.63.0
          playwright install --with-deps chromium
      - run: pnpm build
      - name: Prototype pages
        run: bash tests/run.sh "$RUNNER_TEMP/screens"
      - name: End to end on PostgreSQL 18
        run: bash tests/e2e/run.sh
      - name: Keep the screenshots if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screens
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact --verbose
