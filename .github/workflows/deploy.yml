# Deploys Sevak to Google Cloud Run.
#   staging → staging environment    (every reviewed merge)
#   main    → production environment (only the repository owner can merge into it)
# Each environment is its own Google Cloud project, and each project only
# accepts sign-ins from its own branch (infra/gcp/setup.sh), so nothing else
# can deploy there. There are no stored keys: GitHub Actions signs in to
# Google with short-lived credentials (Workload Identity Federation).
name: Deploy

on:
  push:
    branches: [staging, main]
  workflow_dispatch: # redeploy the branch's latest commit by hand

permissions:
  contents: read
  id-token: write # to sign in to Google Cloud

# One deploy per environment at a time; a newer one waits, never cancels a deploy halfway.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    if: github.ref_name == 'staging' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      SEVAK_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      CLOUDSQL: ${{ vars.GCP_CLOUDSQL_INSTANCE }} # only if the database is Cloud SQL
      DOMAIN: ${{ vars.GCP_DOMAIN }} # e.g. staging.sevak.theanbgroup.com; optional
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sevak/web:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta # domain mappings for Cloud Run are a beta command

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Update the database (and add demo data on staging)
        run: |
          sql_flag=()
          if [ -n "$CLOUDSQL" ]; then sql_flag=(--set-cloudsql-instances "$CLOUDSQL"); fi
          gcloud run jobs deploy sevak-tasks --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --service-account "$RUNTIME_SA" --set-secrets DATABASE_URL=database-url:latest \
            --set-env-vars SEVAK_ENV="$SEVAK_ENV" --command node --args tasks/tasks.mjs,migrate \
            --max-retries 0 --task-timeout 300s "${sql_flag[@]}"
          gcloud run jobs execute sevak-tasks --project "$PROJECT" --region "$REGION" --wait
          if [ "$SEVAK_ENV" = "staging" ]; then
            gcloud run jobs execute sevak-tasks --project "$PROJECT" --region "$REGION" --wait \
              --args tasks/tasks.mjs,seed
          fi

      - name: Deploy the new version (no traffic yet)
        id: deploy
        run: |
          sql_flag=()
          if [ -n "$CLOUDSQL" ]; then sql_flag=(--set-cloudsql-instances "$CLOUDSQL"); fi
          # The very first deploy creates the service, which can't be done without traffic.
          traffic_flag=()
          if gcloud run services describe sevak-web --project "$PROJECT" --region "$REGION" >/dev/null 2>&1; then
            traffic_flag=(--no-traffic)
          fi
          gcloud run deploy sevak-web --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --service-account "$RUNTIME_SA" --set-secrets DATABASE_URL=database-url:latest \
            --set-env-vars SEVAK_ENV="$SEVAK_ENV" --port 8080 --no-invoker-iam-check \
            --min-instances 0 --max-instances 3 --memory 512Mi --cpu 1 \
            --tag next "${traffic_flag[@]}" "${sql_flag[@]}"
          describe() { gcloud run services describe sevak-web --project "$PROJECT" --region "$REGION" --format json; }
          echo "next=$(describe | python3 -c 'import json,sys; print(next(t["url"] for t in json.load(sys.stdin)["status"]["traffic"] if t.get("tag") == "next"))')" >> "$GITHUB_OUTPUT"
          echo "url=$(describe | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"]["url"])')" >> "$GITHUB_OUTPUT"

      - name: Check the new version is healthy
        run: |
          healthy=""
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${{ steps.deploy.outputs.next }}/api/v1/health"; then healthy=1; break; fi
            sleep 10
          done
          if [ -z "$healthy" ]; then
            echo "::error::The new version didn't answer its health check, so users stay on the previous version."
            exit 1
          fi

      # Reads real data from the database through the new version, before any
      # user is sent to it. Staging has demo data to read; production doesn't.
      - name: Check the new version reads the database
        if: env.SEVAK_ENV == 'staging'
        run: |
          curl -fsS "${{ steps.deploy.outputs.next }}/api/v1/events/flute-mali-centenary-celebration" -o event.json
          python3 - <<'PY'
          import json, sys
          event = json.load(open("event.json"))
          shifts = [s for r in event["roles"] for s in r["shifts"]]
          print(f'Read "{event["title"]}" from the database: {len(event["roles"])} roles, {len(shifts)} shifts, '
                f'{sum(s["spotsLeft"] for s in shifts)} spots left.')
          if not event["roles"] or not shifts:
              print("::error::The demo event came back without roles or shifts.")
              sys.exit(1)
          PY

      - name: Switch users to the new version
        run: gcloud run services update-traffic sevak-web --project "$PROJECT" --region "$REGION" --to-latest

      # Connects the environment's own address (GCP_DOMAIN) to the app, once.
      # Needs the domain verified in Google Search Console with sevak-deployer
      # added as an owner, and a CNAME record to ghs.googlehosted.com
      # (infra/gcp/README.md). Until then it warns instead of failing, since the
      # new version is already live.
      - name: Connect the custom domain
        if: env.DOMAIN != ''
        continue-on-error: true
        run: |
          if gcloud beta run domain-mappings describe --domain "$DOMAIN" --project "$PROJECT" --region "$REGION" >/dev/null 2>&1; then
            echo "$DOMAIN is already connected."
          elif ! gcloud beta run domain-mappings create --service sevak-web --domain "$DOMAIN" \
              --project "$PROJECT" --region "$REGION"; then
            echo "::warning::Couldn't connect $DOMAIN. Check that the domain is verified in Search Console with the deploy account as an owner (infra/gcp/README.md, step 4)."
            exit 1
          fi
          echo "DNS records this address needs:"
          gcloud beta run domain-mappings describe --domain "$DOMAIN" --project "$PROJECT" --region "$REGION" \
            --format 'yaml(status.resourceRecords)'
